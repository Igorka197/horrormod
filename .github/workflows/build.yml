name: Build Echoes of the Void

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'
          cache-disabled: true

      - name: Debug environment
        run: |
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          gradle --version 2>&1 | head -5
          echo "=== build.gradle ==="
          head -5 build.gradle

      - name: Build mod JAR
        run: |
          gradle build --no-daemon --stacktrace 2>&1

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: echoes-of-the-void
          path: build/libs/*.jar

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Echoes of the Void — Latest Build"
          files: build/libs/*.jar
