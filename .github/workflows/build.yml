name: Build Echoes of the Void

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
          cache-disabled: true

      - name: Build mod JAR
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build.log 2>&1
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          echo ""
          echo "=== ERRORS ==="
          grep -i "error\|FAILURE\|failed\|exception" build.log | head -30
          echo ""
          echo "=== LAST 80 LINES ==="
          tail -80 build.log
          exit $EXIT_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: echoes-of-the-void
          path: build/libs/*.jar

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Echoes of the Void — Latest Build"
          files: build/libs/*.jar
