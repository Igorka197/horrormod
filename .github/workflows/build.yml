name: Build Echoes of the Void

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'

      - name: Build mod JAR
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      - name: Report errors on failure
        if: failure()
        run: |
          echo "::error::Build failed. Showing errors:"
          grep -E "error:|ERROR|FAILURE" build.log | head -50 | sed 's/^/::error::/'

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: echoes-of-the-void
          path: build/libs/*.jar

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Echoes of the Void — Latest Build"
          files: build/libs/*.jar
